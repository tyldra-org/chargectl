name: Bug report
description: Report something that does not work as documented.
title: "bug: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Security vulnerabilities must be reported
        privately; see SECURITY.md. Search existing issues before filing.
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps or code that shows the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit SHA of Chargectl you built.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Mac model, macOS version and charger. Say if another charge limiter is installed.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and output
      description: Paste the relevant lines from the Logs page, or the output of ./scripts/install.sh --logs.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
