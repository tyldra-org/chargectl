# Publishes a release when a version tag is pushed:
#
#   git tag -a v0.1.0 -m "Chargectl 0.1.0" && git push origin v0.1.0
#
# The tag must match MARKETING_VERSION in project.yml, and CHANGELOG.md must
# have a section for that version. Four jobs:
#   build     checks the tag and the release notes, runs the format check and the
#             tests, then builds Chargectl-<version>.zip from scratch, signs and
#             attests it
#   cask      the Homebrew tap's own checks on the cask, beside build on another
#             runner
#   publish   only once both passed: the GitHub release with the zip, its
#             checksum and the Homebrew cask
#   homebrew  opens a pull request with the new cask in
#             tyldra-org/homebrew-tools, which merges itself once the tap's
#             CI passes
# A failed homebrew job can be rerun on its own; the release stays published.
#
# The tests and the build share one runner on purpose. After the tests, in the
# same DerivedData, the Release build took 65 s (v0.2.3); alone on a fresh
# runner it took 2m41s (dry run 42590886557).
#
# Run it by hand (Actions > Release > Run workflow) for a dry run: the same
# checks and signed build for the version in project.yml, without attesting,
# publishing or touching the tap.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time; never cancel one halfway through publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Check, build, sign and attest
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # sign the build provenance attestation
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 27.1
        run: sudo xcode-select --switch /Applications/Xcode_27.1.app

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xcodegen

      - name: Check the tag against project.yml and CHANGELOG.md
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(./scripts/version.sh)
          if [[ "$EVENT" == push && "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG does not match MARKETING_VERSION $version in project.yml."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/dist"
          ./scripts/release-notes.sh "$version" > "$RUNNER_TEMP/notes.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The tests use the compilation cache CI's macOS job keeps on main; the key must match
      # ci.yml's. The build that is published does not: it is compiled from scratch below.
      - name: Choose the DerivedData folder and the cache key
        id: cache
        run: |
          echo "CHARGECTL_DERIVED_DATA=$RUNNER_TEMP/DerivedData" >> "$GITHUB_ENV"
          echo "key=compilation-cache-$(xcodebuild -version | head -1 | tr -d ' ')-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore the compilation cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/DerivedData/CompilationCache.noindex
          key: ${{ steps.cache.outputs.key }}-${{ github.sha }}
          restore-keys: ${{ steps.cache.outputs.key }}-

      - name: Format and test
        run: ./scripts/check.sh --all format test

      - name: Import the release certificate
        env:
          CERTIFICATE: ${{ secrets.CHARGECTL_RELEASE_CERTIFICATE }}
          PASSWORD: ${{ secrets.CHARGECTL_RELEASE_CERTIFICATE_PASSWORD }}
        run: ./scripts/import-release-certificate.sh

      - name: Build and package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # From scratch, not from the compilation cache: what is published is built only from
          # this commit.
          CHARGECTL_COMPILATION_CACHE: "0"
        run: |
          zip=$(./scripts/package.sh "$RUNNER_TEMP/dist")
          sha256=$(awk '{ print $1 }' "$zip.sha256")
          ./scripts/cask.sh "$VERSION" "$sha256" > "$RUNNER_TEMP/dist/chargectl.rb"
          cp "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/dist/notes.md"
          {
            echo "zip=$zip"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.zip }}

      - name: Keep the zip, its checksum, the cask and the notes for publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 7

  cask:
    # brew style and audit, as the tap's CI runs them, so the tap's pull
    # request passes. Beside build, on its own runner.
    name: Check the cask
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the cask
        run: ./scripts/check.sh --all cask

  publish:
    name: Publish the release
    needs: [build, cask]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd "$RUNNER_TEMP/dist"
          sha256sum --check "Chargectl-$VERSION.zip.sha256"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Chargectl $VERSION" --notes-file notes.md \
            "Chargectl-$VERSION.zip" "Chargectl-$VERSION.zip.sha256" chargectl.rb

  homebrew:
    name: Update the Homebrew tap
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tyldra-release GitHub App can write to the tap and open pull
      # requests there; nothing else.
      - name: Get a token for the tap
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: tyldra-org
          repositories: homebrew-tools
          # Only what opening and auto-merging the pull request needs, not every
          # permission of the app's installation.
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tyldra-org/homebrew-tools
          token: ${{ steps.token.outputs.token }}
          path: tap
          # The git push below uses these credentials; nothing in this job uploads the folder.
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Open a pull request with the new cask
        working-directory: tap
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          BOT: ${{ steps.token.outputs.app-slug }}[bot]
        run: |
          branch="chargectl-$VERSION"
          title="feat(chargectl): update to $VERSION"
          git switch -c "$branch"
          mkdir -p Casks
          ../scripts/cask.sh "$VERSION" "$SHA256" > Casks/chargectl.rb
          git add Casks/chargectl.rb
          if git diff --cached --quiet; then
            echo "The tap already has Chargectl $VERSION."
            exit 0
          fi
          user_id=$(gh api "/users/$BOT" --jq .id)
          git config user.name "$BOT"
          git config user.email "$user_id+$BOT@users.noreply.github.com"
          git commit -q -m "$title"
          git push --force origin "$branch"
          cat > "$RUNNER_TEMP/body.md" <<BODY
          ## What changed

          \`Casks/chargectl.rb\` at $VERSION, from the [v$VERSION release](https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION).

          ## Why

          A new Chargectl release.

          ## Evidence

          - tested: the release workflow built, attested and checksummed \`Chargectl-$VERSION.zip\`; this cask pins that checksum. This pull request's CI audits it.

          ## What's left

          Nothing. It merges by itself when CI passes.
          BODY
          # Only an open pull request counts: earlier releases left merged
          # ones behind on reused branch names.
          url=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url // empty')
          if [[ -z "$url" ]]; then
            url=$(gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md")
          fi
          gh pr merge "$url" --auto --squash
          echo "Pull request: $url"
