# Dependabot pull requests land on main by themselves once the
# ruleset's required checks pass: "ci", and "linked-issue", which passes
# for Dependabot without an issue. Patch and minor
# updates and all GitHub Actions updates get auto-merge; a major package
# update stays open for a maintainer. A failing check leaves any of them open.
# Needs "Allow auto-merge" on in the repository settings.
name: dependabot-auto-merge

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  auto-merge:
    name: auto-merge
    # Only Dependabot's own PRs in this repository, never a fork's.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'tyldra-org/chargectl'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read the update
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge
        if: steps.meta.outputs.package-ecosystem == 'github_actions' || steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
