# A pull request from outside resolves an issue: its description names one
# with a closing keyword ("Closes #12"), or one is linked under Development.
# The issue is where the change is agreed before anyone writes it. Three
# kinds need none:
# - Pull requests from the maintainers in .github/MAINTAINERS, read from the
#   default branch. They open an issue when the work is worth tracking on its
#   own, not for every change.
# - Pull requests from automation, such as Dependabot.
# - Pull requests that change Markdown files only, such as a typo fix. This
#   is judged by the files, not the title. Protected Markdown, such as
#   CONTRIBUTING.md, stays with the protected-files check.
#
# This runs again when the description changes, so it is a required check of
# its own, next to "ci", never a job inside ci.yml: an edit must not
# rerun the build, and a description-only rerun must not report the build as
# passed. A pull request that edits this file fails protected-files.
name: linked-issue

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: linked-issue-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linked-issue:
    name: linked-issue
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Find the issue this pull request resolves
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Automation that opens pull requests. Add the login of any other bot
          # this repository uses; a login ending in [bot] belongs to a GitHub
          # App and no person can take it.
          case $AUTHOR in
            'dependabot[bot]')
              echo "Opened by $AUTHOR: no issue needed."
              exit 0
              ;;
          esac
          # Failed reads stop the step (bash -e) instead of passing it.
          linked=$(gh pr view "$NUMBER" --repo "$REPO" --json closingIssuesReferences \
            --jq '.closingIssuesReferences | length')
          if [ "$linked" -gt 0 ]; then
            echo "Resolves $linked issue(s)."
            exit 0
          fi
          maintainers=$(gh api "repos/$REPO/contents/.github/MAINTAINERS" -H 'Accept: application/vnd.github.raw')
          while IFS= read -r line; do
            login=${line%%#*}
            login=${login//[[:space:]]/}
            if [ -n "$login" ] && [ "${login,,}" = "${AUTHOR,,}" ]; then
              echo "Opened by $AUTHOR, a maintainer: no issue needed."
              exit 0
            fi
          done <<< "$maintainers"
          files=$(gh api --paginate "repos/$REPO/pulls/$NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)')
          markdown_only=1
          while IFS= read -r file; do
            case $file in
              *.md) ;;
              *) markdown_only=0 ;;
            esac
          done <<< "$files"
          if [ "$markdown_only" = 1 ]; then
            echo "Changes Markdown files only: no issue needed."
            exit 0
          fi
          echo '::error::Link the issue this pull request resolves: add "Closes #<number>" to its description. Open an issue first if there is none. A change to Markdown files alone needs no issue.'
          exit 1
