# Only the maintainers named in this file change what decides how the project
# is run, checked, released or licensed: repository automation (.github), the
# license and policy documents, AGENTS.md, and the scripts CI and releases
# trust. A pull request from anyone else that touches one fails, whatever
# access its author has and whoever approves it; with no bypass on the
# ruleset, it cannot merge. Dependabot may change workflow files only, to
# update action pins.
#
# pull_request_target runs this file from the default branch, so a pull
# request cannot rewrite the check that judges it, or the list of maintainers.
# It never checks out or runs the pull request's code: it reads the author and
# the names of the changed files from the API, with a read-only token.
name: protected-files

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no checkout; reads API metadata only
    types: [opened, reopened, synchronize]

permissions: {}

concurrency:
  group: protected-files-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  protected-files:
    name: protected-files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check the files this pull request changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # The only accounts that change protected files, whatever access anyone
          # else is given. Separate logins with spaces.
          maintainers='yogeshprasad098'
          for login in $maintainers; do
            if [ "$AUTHOR" = "$login" ]; then
              echo "Opened by $AUTHOR, a maintainer: any file may change."
              exit 0
            fi
          done
          dependabot=0
          if [ "$AUTHOR" = 'dependabot[bot]' ]; then dependabot=1; fi
          protected() {
            case $1 in
              .github/*) return 0 ;;
              LICENSE | LICENSE.* | LICENSE-* | COPYING | COPYING.* | NOTICE | NOTICE.*) return 0 ;;
              SECURITY.md | CODE_OF_CONDUCT.md | CONTRIBUTING.md | GOVERNANCE.md | SUPPORT.md) return 0 ;;
              MAINTAINERS | MAINTAINERS.md | CODEOWNERS | docs/CODEOWNERS) return 0 ;;
              AGENTS.md | */AGENTS.md) return 0 ;;
              scripts/check.sh | scripts/ci-scope.*) return 0 ;;
              # Release and signing scripts, and what the app may do.
              scripts/package.sh | scripts/signing.sh | scripts/version.sh) return 0 ;;
              scripts/import-release-certificate.sh | scripts/make-release-certificate.sh) return 0 ;;
              scripts/cask.sh | scripts/check-cask.sh | scripts/release-notes.sh) return 0 ;;
              *.entitlements) return 0 ;;
            esac
            return 1
          }
          # A failed listing stops the step (bash -e) instead of passing it.
          files=$(gh api --paginate "repos/$REPO/pulls/$NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)')
          blocked=()
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            # Dependabot updates action pins in workflow files, nothing else here.
            if [ "$dependabot" = 1 ]; then
              case $file in .github/workflows/*) continue ;; esac
            fi
            if protected "$file"; then blocked+=("$file"); fi
          done <<< "$files"
          if [ ${#blocked[@]} -eq 0 ]; then
            echo "No maintainer-owned files changed."
            exit 0
          fi
          # File names come from the pull request; keep them from being read as
          # workflow commands.
          stop=$(openssl rand -hex 16)
          echo "::stop-commands::$stop"
          echo "Only maintainers change these files:"
          printf '  %s\n' "${blocked[@]}"
          echo "::$stop::"
          echo "::error::This pull request changes files only maintainers change. Open an issue describing the change instead (CONTRIBUTING.md)."
          exit 1
