# Continuous integration. Every job calls scripts/check.sh, the same entry
# point developers run locally. Branch protection requires only the aggregate
# job "ci", so jobs can be added or renamed without editing the ruleset.
#
# The "changes" job runs first and picks the jobs a change needs
# (scripts/ci-scope.sh), so a docs-only change finishes in seconds. A changed
# path that no list in the script names runs everything. Pull requests also
# run only the test suites the change reaches; pushes to main, the weekly run
# and manual runs run every test. The cask check runs beside the macOS build
# and tests, on its own runner.
# There are deliberately no paths filters on the triggers: a skipped workflow
# never reports "ci", and the merge would wait forever.
name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    # Weekly full run, for runner image and Xcode drift.
    - cron: "23 5 * * 1"
  workflow_dispatch:

# Read-only by default; no job needs more. No secrets are used, so fork pull
# requests run with the same workflow safely.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded pull request runs only; every default-branch run completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Decides which jobs and test suites this change needs. Docs-only changes
    # skip everything else; the "ci" job still reports.
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        # pipefail: a failing scope script must fail the job, never leave the
        # outputs empty and skip every check.
        shell: bash
    outputs:
      swift: ${{ steps.scope.outputs.swift }}
      cask: ${{ steps.scope.outputs.cask }}
      shell: ${{ steps.scope.outputs.shell }}
      workflows: ${{ steps.scope.outputs.workflows }}
      tests: ${{ steps.scope.outputs.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request checks out its merge commit; its first parent is
          # the base branch, so the diff is exactly what the PR changes.
          fetch-depth: 2
          persist-credentials: false
      - name: Find the base commit
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=""
          case "$EVENT" in
            pull_request) base=$(git rev-parse HEAD^1) ;;
            # A new branch or a force push has no usable "before": check everything.
            push)
              if git fetch --no-tags --depth=1 origin "$BEFORE"; then base=$BEFORE; fi
              ;;
          esac
          # Only a full commit ID or nothing reaches the scope script.
          if [[ ! $base =~ ^[0-9a-f]{40}$ ]]; then base=""; fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Decide what to check
        id: scope
        env:
          BASE: ${{ steps.base.outputs.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          ./scripts/ci-scope.sh areas "$BASE" | tee -a "$GITHUB_OUTPUT"
          if [ "$EVENT" = pull_request ]; then
            ./scripts/ci-scope.sh tests "$BASE" | tee -a "$GITHUB_OUTPUT"
          else
            echo tests=all | tee -a "$GITHUB_OUTPUT"
          fi

  static:
    name: Shell and workflows
    needs: changes
    if: needs.changes.outputs.shell == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Dependabot cannot bump these two; update them by hand.
      ACTIONLINT_VERSION: v1.7.12
      ZIZMOR_VERSION: "1.32.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint comes from the Actions cache, so most runs download nothing.
      # On a miss it is built from the Go module proxy, which go install checks
      # against the Go checksum database, with retries. Only main saves it; pull
      # requests restore it.
      - name: Restore actionlint
        id: actionlint
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/actionlint
          key: ${{ runner.os }}-actionlint-${{ env.ACTIONLINT_VERSION }}
      - name: Install actionlint
        if: steps.actionlint.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3; do
            go install "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION" && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep $((attempt * 15))
          done
      - name: Save actionlint
        if: github.ref == 'refs/heads/main' && steps.actionlint.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/actionlint
          key: ${{ runner.os }}-actionlint-${{ env.ACTIONLINT_VERSION }}
      # zizmor from PyPI through pipx, which GitHub's Linux images include.
      - name: Install zizmor
        run: pipx install "zizmor==$ZIZMOR_VERSION"
      - name: Check
        run: PATH="$HOME/go/bin:$HOME/.local/bin:$PATH" ./scripts/check.sh --all shell workflows

  macos:
    # One job on purpose. With warm caches, the tests took 21 s after the Release
    # build in the same DerivedData (run 42581666649) and 54 s on a runner of
    # their own (run 42591414912), so splitting them saved nothing and cost a
    # second macOS runner.
    name: Format, build and test
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    # macOS 27 with Xcode 27 (public preview image).
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 27.1
        run: sudo xcode-select --switch /Applications/Xcode_27.1.app
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xcodegen
      # Xcode's compilation cache (COMPILATION_CACHE_ENABLE_CACHING in project.yml) is kept
      # between runs, so a build compiles only what changed: about 5 seconds instead of 40 for a
      # full Release build on a Mac. DerivedData sits at a fixed path so cache entries match; the
      # key changes with Xcode and each month, which starts the cache afresh. release.yml
      # restores the same key for its tests. Only main saves it; pull requests restore main's.
      - name: Choose the DerivedData folder and the cache key
        id: cache
        run: |
          echo "CHARGECTL_DERIVED_DATA=$RUNNER_TEMP/DerivedData" >> "$GITHUB_ENV"
          echo "key=compilation-cache-$(xcodebuild -version | head -1 | tr -d ' ')-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore the compilation cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/DerivedData/CompilationCache.noindex
          key: ${{ steps.cache.outputs.key }}-${{ github.sha }}
          restore-keys: ${{ steps.cache.outputs.key }}-
      - name: Check
        env:
          # all, none (build the tests only) or the suites the change reaches.
          CHARGECTL_TEST_SUITES: ${{ needs.changes.outputs.tests }}
        run: ./scripts/check.sh --all format build test
      - name: Save the compilation cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/DerivedData/CompilationCache.noindex
          key: ${{ steps.cache.outputs.key }}-${{ github.sha }}

  cask:
    # brew style and audit on the cask, as the tap's CI runs them. Its own job, so
    # it runs beside the build instead of after it. It needs Homebrew, not Xcode;
    # the image matches the release workflow's cask check.
    name: Homebrew cask
    needs: changes
    if: needs.changes.outputs.cask == 'true'
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # check-cask.sh checks with the newest Homebrew, as the tap's CI does.
      # Updating first lets the gem cache key follow Homebrew's Gemfile.lock.
      - name: Update Homebrew
        id: brew
        run: |
          brew update --quiet
          repo=$(brew --repository)
          echo "gems-path=$repo/Library/Homebrew/vendor/bundle/ruby/" >> "$GITHUB_OUTPUT"
          echo "gems-hash=$(shasum -a 256 "$repo/Library/Homebrew/Gemfile.lock" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # brew style installs RuboCop and its gems on first use; in the tap's CI,
      # brew style took 44 of test-bot's 50 seconds. Only main saves the gems;
      # pull requests restore main's.
      - name: Restore Homebrew's gems
        id: gems
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.brew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.brew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-
      - name: Check
        run: ./scripts/check.sh --all cask
      - name: Save Homebrew's gems
        if: github.ref == 'refs/heads/main' && steps.gems.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.brew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.brew.outputs.gems-hash }}

  required:
    # The single required status check. It succeeds only if every needed job
    # succeeded or was skipped because the change did not need it.
    name: ci
    if: always()
    needs: [changes, static, macos, cask]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all jobs to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::A required job finished with: $result"; exit 1 ;;
            esac
          done
          echo "All required jobs passed: $RESULTS"
