name: Chargectl
options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: '27.0'
  deploymentTarget:
    macOS: '27.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: '27.0'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ''
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: '0.1.5'
    CURRENT_PROJECT_VERSION: '6'
    SWIFT_OBJC_BRIDGING_HEADER: Shared/SMC/SMCBridge.h
targets:
  Chargectl:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Resources/Info.plist
          - Resources/Chargectl.entitlements
      - path: Shared
      - path: Daemon/Resources/com.tyldra.chargectl.daemon.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - target: chargectld
        embed: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tyldra.chargectl
        PRODUCT_NAME: Chargectl
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/Chargectl.entitlements
        GENERATE_INFOPLIST_FILE: NO
  chargectld:
    type: tool
    platform: macOS
    sources:
      - path: Daemon
        excludes:
          - Resources/**
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tyldra.chargectl.daemon
        PRODUCT_NAME: Chargectl Service
        INFOPLIST_FILE: Daemon/Resources/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  ChargectlTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tyldra.chargectl.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Chargectl:
    build:
      targets:
        Chargectl: all
        ChargectlTests: [test]
    test:
      targets:
        - ChargectlTests
    run:
      config: Debug
    archive:
      config: Release
